name: Run analyze and test

on:
  push:
    branches-ignore: [ "master" ]
  workflow_dispatch:

jobs:
  analyze-test:
    uses: weewx-extensions/development-tools/.github/workflows/analyze-test.yml@v6
    with:
      module-name: 'healthchecks'
      #pip-list: 'paho-mqtt'
      #package-list: 'mosquitto'
      unit-test: true
      function-test: false
      integration-test: false
      e2e-test: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
