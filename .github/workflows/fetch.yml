name: Fetch Upstream

on:
  schedule:
    - cron: '7 0 * * *'
  # Allows manual workflow run (must in default branch to work)
  workflow_dispatch:

jobs:
  fetch:
    permissions: write-all
    uses: weewx-extensions/development-tools/.github/workflows/fetch.yml@v6
    with:
      upstream_url: "https://github.com/weewx-extensions/healthchecks.git"
      # Do not prune, a fork may have tags of its own.
      fetch_args: '--tags'
    secrets:
      workflow_token: ${{ secrets.GITHUB_TOKEN }}
